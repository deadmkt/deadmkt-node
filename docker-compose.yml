services:
  node1:
    build: .
    container_name: deadmkt-node1
    stdin_open: true
    tty: true
    volumes:
      - node1-data:/data
      - ./strategies/bullish.py:/data/strategy.py
    ports:
      - "9091:9090"   # strategy WS
      - "9191:9191"   # gossip (if needed)
    environment:
      - DEADMKT_DATA_DIR=/data
      - DEADMKT_KEYSTORE_PASSWORD=${NODE1_PASSWORD:-testnet123}
      - DEADMKT_DIAL_PEERS=deadmkt-node2:9191
      # Override contract address: set CONTRACT_ADDR in .env or shell
      - DEADMKT_CONTRACT_ADDR=${CONTRACT_ADDR:-}
    restart: unless-stopped

  node2:
    build: .
    container_name: deadmkt-node2
    stdin_open: true
    tty: true
