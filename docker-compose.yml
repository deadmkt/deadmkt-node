      - DEADMKT_KEYSTORE_PASSWORD=${NODE2_PASSWORD:-testnet456}
      - DEADMKT_DIAL_PEERS=deadmkt-node1:9191
      # Override contract address: set CONTRACT_ADDR in .env or shell
      - DEADMKT_CONTRACT_ADDR=${CONTRACT_ADDR:-}
    restart: unless-stopped

