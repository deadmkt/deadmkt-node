[package]
name = "deadmkt-keystore"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# MR1d: when enabled, insecure (unencrypted on-disk) keystore mode is
# disabled at runtime. Release builds for mainnet must enable this.
# Default (off) keeps insecure mode available for scale-test and the
# interactive `setup --insecure` flow.
production = []
